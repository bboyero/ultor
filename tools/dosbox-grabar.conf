[sdl]
windowed=true
output=opengl
fullresolution=original

[dosbox]
machine=svga_s3
memsize=16

[render]
aspect=true
scaler=normal2x

[cpu]
cycles=auto

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
sbmixer=true
oplmode=auto
oplemu=default
oplrate=44100

[autoexec]
mount c C:\disketes\msdos\ultor\ULTOR
c:
cd subdir
GO.BAT
